# --- build ---
#
# RE-MEASURED FROM THE INDEX'S ARTIFACTS on 2026-08-24, and the reason is worth
# recording: these two hashes were previously taken from Debian's repackaged
# wheels in /usr/share/python-wheels. That arrangement is superseded; under it
# THOSE were the artifacts, and offline resolution from a local directory is what
# the hashes described. Item 4bp made the configured index the
# source, and the index serves different bytes for the same version -- so the
# first locked download after the ruling was REFUSED by `--require-hashes`,
# naming pip's expected and actual digests.
#
# That refusal is the mechanism working exactly as intended, and it is why the
# hashes had to be re-measured rather than carried over: a hash is a fact about
# BYTES, and the bytes changed when their source did.
