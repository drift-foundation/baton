# The complete resolved environment for the v12 Python distribution, pinned
# with hashes.
#
# THE RUNTIME SET IS NO LONGER EMPTY, and the change is a ruling rather than a
# convenience. PLAN item 4bh: the Worker Manager validates frozen JSON Schema
# and a handwritten substitute is forbidden, so a real Draft 2020-12 validator
# is pinned here with its complete Python 3.13 resolver closure. Options B (a
# test-only oracle) and C (a partial first cut) were considered and rejected.
#
# The AUTHORITY slice is still standard-library only and a case proves it. This
# distribution ships two slices and only one of them may reach a dependency;
# `tests/authority/test_boundary.py` holds the authority to the empty set and
# `tests/manager/test_dependencies.py` holds the manager to exactly this list.
#
# Every hash below was computed from the ARTIFACT on 2026-08-24, not copied from
# an index page. A lock whose hashes came from a document rather than from the
# bytes pins a claim.
#
# PLAN item 4bp: the repository does not carry those artifacts. A checkout builds
# a disposable environment and downloads exactly these from its configured index,
# and `--require-hashes` refuses anything whose SHA-256 is not the one below --
# so what this file guarantees is the same whether the bytes came from an index,
# an operator cache or a certified bundle.

# --- runtime: the ruled Draft 2020-12 validator and its closure ---
